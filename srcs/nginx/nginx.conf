# =============================================================================
# nginx.conf : nginx est l'unique porte d'entree.
#   1) il termine le TLS (dechiffre le HTTPS) ;
#   2) il sert le frontend (proxifie vers Vite en dev) ;
#   3) il relaie /api vers le backend NestJS.
# Front/back/database ne parlent jamais directement au navigateur.
# =============================================================================

# Laisse nginx choisir automatiquement le nombre de processus workers (selon les CPU).
worker_processes auto;

# Bloc de configuration des connexions.
events {
    # Nombre maximal de connexions simultanees par worker.
    worker_connections 1024;
}

# Bloc principal : toute la configuration HTTP.
http {
    # Charge la table des types MIME (associe extension -> Content-Type).
    # Pourquoi : sans elle, les .js/.css seraient servis avec un mauvais type.
    include       /etc/nginx/mime.types;
    # Type par defaut quand l'extension est inconnue.
    default_type  application/octet-stream;

    # Table de correspondance pour gerer la "montee en WebSocket".
    # Un WebSocket demarre par une requete HTTP portant l'en-tete "Upgrade: websocket".
    # Pourquoi : on reutilise $connection_upgrade plus bas pour que le HMR de Vite ET,
    # plus tard, le Socket.IO de Ny fonctionnent a travers le proxy.
    map $http_upgrade $connection_upgrade {
        # Si "Upgrade" est present -> la valeur devient "upgrade".
        default upgrade;
        # Si "Upgrade" est vide (requete HTTP normale) -> "close".
        ''      close;
    }

    # Premier serveur virtuel : ecoute le port 80 (HTTP en clair).
    server {
        # Port d'ecoute.
        listen 80;
        # Accepte n'importe quel nom d'hote.
        server_name _;
        # Redirige tout vers HTTPS (301 = redirection permanente).
        # Le port 8443 est explicite car c'est le port PUBLIE sur l'hote (contrainte
        # rootless). Sans lui, le navigateur serait renvoye vers :443, qui n'est plus expose.
        return 301 https://$host:8443$request_uri;
    }

    # Deuxieme serveur virtuel : le vrai, en HTTPS sur le port 443.
    server {
        # Active l'ecoute TLS sur le port 443.
        listen 443 ssl;
        # Accepte n'importe quel nom d'hote.
        server_name _;

        # Chemin du certificat public (genere par le Dockerfile).
        ssl_certificate     /etc/nginx/certs/cert.pem;
        # Chemin de la cle privee correspondante.
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Regle "/" : tout ce qui n'est pas /api va au serveur de dev Vite (frontend).
        location / {
            # Transmet la requete au conteneur frontend ; "frontend" est resolu par le DNS Docker.
            proxy_pass http://frontend:5173;
            # Force HTTP/1.1 : indispensable pour la montee en WebSocket.
            proxy_http_version 1.1;
            # Recopie l'en-tete Upgrade du client (necessaire au HMR de Vite).
            proxy_set_header Upgrade    $http_upgrade;
            # Positionne Connection selon la table "map" ci-dessus (upgrade ou close).
            proxy_set_header Connection $connection_upgrade;
            # Transmet le nom d'hote demande par le client.
            proxy_set_header Host       $host;
        }

        # Regle "/socket.io" : le canal WebSocket temps reel vers le backend.
        # Pourquoi une regle DEDIEE : Socket.IO n'est pas sous /api (son chemin par
        # defaut est /socket.io/) ; sans ce bloc, le handshake tomberait dans
        # "location /" et serait envoye a Vite, qui ne sait pas le traiter.
        location /socket.io {
            # Transmet au backend (nom resolu par le DNS interne Docker).
            proxy_pass http://backend:3000;
            # HTTP/1.1 obligatoire : la montee en WebSocket n'existe pas en HTTP/1.0.
            proxy_http_version 1.1;
            # Recopie l'en-tete Upgrade envoye par le navigateur.
            proxy_set_header Upgrade    $http_upgrade;
            # Positionne Connection via la table "map" definie plus haut.
            # PIEGE CLASSIQUE : sans ces deux en-tetes, pas d'erreur visible — Socket.IO
            # bascule silencieusement en long-polling. Ca "marche" mais ce n'est plus
            # du WebSocket (latence superieure, et l'evaluateur le verra).
            proxy_set_header Connection $connection_upgrade;
            # Transmet le nom d'hote demande.
            proxy_set_header Host       $host;
            # Transmet l'IP reelle du client.
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Indique au backend que l'origine etait en HTTPS.
            proxy_set_header X-Forwarded-Proto $scheme;
            # Desactive le timeout de lecture : une connexion WebSocket reste ouverte
            # longtemps sans trafic. Avec le defaut (60s), elle serait coupee au repos.
            proxy_read_timeout 3600s;
        }

        # Regle "/api" : tout /api/... va au backend NestJS sur le port 3000.
        location /api {
            # Transmet au conteneur backend ; sans chemin ajoute, l'URI est preservee
            # telle quelle -> /api/health arrive au backend comme /api/health.
            proxy_pass http://backend:3000;
            # HTTP/1.1 pour supporter les WebSockets (Socket.IO plus tard).
            proxy_http_version 1.1;
            # Recopie l'en-tete Upgrade (pret pour le temps reel).
            proxy_set_header Upgrade    $http_upgrade;
            # Connection gere par la table "map".
            proxy_set_header Connection $connection_upgrade;
            # Transmet le nom d'hote.
            proxy_set_header Host       $host;
            # Transmet l'adresse IP reelle du client (chaine des proxys).
            # Pourquoi : sans ca, le backend ne verrait que l'IP de nginx.
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # Indique au backend que la requete d'origine etait en HTTPS.
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
