# nginx est l'unique porte d'entree : il termine le TLS, sert le frontend et
# relaie /api vers le backend. Front, back et base ne parlent jamais directement
# au navigateur.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Montee en WebSocket : un WebSocket demarre par une requete HTTP portant
    # l'en-tete "Upgrade: websocket". $connection_upgrade est reutilise plus bas
    # pour le HMR de Vite, Socket.IO et Grafana Live.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- Redirection HTTP -> HTTPS -------------------------------------------

    server {
        listen 80;
        server_name _;
        # Le port 8443 est explicite car c'est le port publie sur l'hote (contrainte
        # rootless) : sans lui, le navigateur serait renvoye vers :443, non expose.
        return 301 https://$host:8443$request_uri;
    }

    # --- Serveur public HTTPS ------------------------------------------------

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # Tout ce qui n'est pas /api va au serveur de dev Vite. HTTP/1.1 et les deux
        # en-tetes Upgrade/Connection sont indispensables au HMR.
        location / {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
        }

        # Regle dediee : le chemin par defaut de Socket.IO n'est pas sous /api, et
        # sans ce bloc le handshake tomberait dans "location /", donc chez Vite.
        # Sans Upgrade/Connection, aucune erreur visible : Socket.IO bascule
        # silencieusement en long-polling.
        location /socket.io {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Une connexion WebSocket reste ouverte longtemps sans trafic ; le defaut
            # de 60 s la couperait au repos.
            proxy_read_timeout 3600s;
        }

        # Les metriques applicatives ne sortent jamais du reseau prive : Prometheus
        # scrape backend:3000 directement. Les exposer revelerait la topologie
        # interne a n'importe quel visiteur.
        location /api/metrics {
			return 404;
		}

        location /api {
            # Le defaut de nginx est 1 Mo : sans cette ligne, tout televersement plus
            # gros est rejete en 413 avant meme d'atteindre NestJS. Volontairement
            # 12m alors que l'application limite a 10 Mo, pour que le backend refuse
            # lui-meme avec un message clair.
            client_max_body_size 12m;
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Monitoring ------------------------------------------------------
        # Ces services ne publient aucun port hote : ce proxy est le seul acces, ils
        # heritent donc du TLS de nginx.
        # Pas de slash final sur proxy_pass : l'URI doit arriver inchangee, pour
        # correspondre au prefixe /prometheus/ de --web.external-url.
    	location /prometheus/ {
            auth_basic           "Monitoring ft_transcendence";
            auth_basic_user_file /etc/nginx/.htpasswd;
	        proxy_pass http://prometheus:9090;

        	proxy_set_header Host              $host;
        	proxy_set_header X-Real-IP         $remote_addr;
        	proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        	proxy_set_header X-Forwarded-Proto $scheme;
    	}

        # Sans slash final, /prometheus ne correspond a aucun bloc ci-dessus et
        # retomberait dans "location /", donc chez Vite, qui repondrait 404.
        location /prometheus {
            return 301 https://$host:8443/prometheus/;
        }

        # Le sous-chemin correspond a GF_SERVER_SERVE_FROM_SUB_PATH.
        location /grafana/ {
            proxy_pass http://grafana:3000;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Grafana Live : canal WebSocket que l'UI garde ouvert en permanence.
        location /grafana/api/live/ {
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
        }

        location /grafana {
            return 301 https://$host:8443/grafana/;
        }

        location /alertmanager/ {
            auth_basic           "Monitoring ft_transcendence";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://alertmanager:9093;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /alertmanager {
            return 301 https://$host:8443/alertmanager/;
        }
    }

    # --- Serveur interne, reserve au monitoring ------------------------------
    # Ce port n'est pas publie dans docker-compose.yml : il n'est joignable que
    # depuis le reseau prive Docker. nginx reste le seul service a publier des
    # ports, et il n'en publie pas un de plus.

    server {
        listen 8081;
        server_name _;

        # Module stub_status, compile par defaut dans l'image officielle : expose
        # sept compteurs (connexions actives, acceptees, traitees, requetes totales,
        # etats reading / writing / waiting).
        location /stub_status {
            stub_status;
        }

        # Puits de notifications : Alertmanager y POSTe son JSON. La ligne de log
        # prouve que la chaine complete a fonctionne (regle evaluee -> alerte
        # transmise -> notification delivree). 204 = accuse de reception sans corps,
        # et Alertmanager considere tout code 2xx comme une livraison reussie.
        location /alert-sink {
            return 204;
        }

        # Tout le reste est refuse : la surface exposee se limite aux deux URL utiles.
        location / {
            return 404;
        }
    }
}