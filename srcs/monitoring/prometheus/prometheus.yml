# Prometheus server config

global:
  scrape_interval: 15s # Set the scrape interval to every 15 seconds. Default is every 1 minute.
  evaluation_interval: 15s # Evaluate rules every 15 seconds. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).
  external_labels:
    monitor: ft_transcendence

# Alertmanager configuration
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           # - alertmanager:9093

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'.
# rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"


# The list of targets Prometheus pulls metrics from
scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  # Prometheus scrapes itself
  - job_name: "prometheus"

    metrics_path: /prometheus/metrics
    # scheme defaults to 'http'.

    static_configs:
      - targets: ["localhost:9090"]
       # 'localhost' here is inside the Prometheus container itself.

  # node-exporter gets the host machine metrics
  - job_name: "node"

    static_configs:
      - targets: ["node-exporter:9100"]
      # port 9100: node-exporter's default listening port

  # NestJS backend: application metrics exposed by prom-client
  - job_name: "backend"

    # The Nest global prefix is /api, so the endpoint is /api/metrics,
    # not Prometheus' default /metrics.
    metrics_path: /api/metrics

    static_configs:
      - targets: ["backend:3000"]
      # Plain HTTP on the private bridge network: TLS terminates at nginx,
      # and this traffic never leaves the Docker network.

  - job_name: "postgres"

    static_configs:
      - targets: ["postgres-exporter:9187"]
      #default postgres-exporter's port 

  # nginx, via son exporter (page stub_status)
  - job_name: "nginx"

    static_configs:
      - targets: ["nginx-exporter:9113"]
      # 9113 : port par defaut de nginx-prometheus-exporter