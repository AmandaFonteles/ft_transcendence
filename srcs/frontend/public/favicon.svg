<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Aqan">
<!--
  favicon.svg : icone d'onglet.

  POURQUOI CE FICHIER EXISTE : sans balise <link rel="icon">, tout navigateur
  demande automatiquement /favicon.ico a la racine. Le fichier n'existait pas,
  donc la console affichait un 404 a chaque chargement de page — ce que la grille
  d'evaluation interdit ("no warnings or errors in the browser console").
  Declarer une icone dans index.html supprime cette requete de repli.

  POURQUOI DU SVG plutot qu'un .ico : net a toutes les densites d'ecran, quelques
  centaines d'octets, et lisible/modifiable en texte comme le reste du depot.

  MOTIF : trois lignes de taches, chacune portant l'arete coloree de son projet.
  C'est exactement le motif de TaskRow et de l'agenda general, ou se melangent
  les taches de plusieurs projets. Les couleurs sont celles du theme
  (styles/theme.css) mais ecrites en dur : un fichier SVG servi en tant qu'IMAGE
  n'a pas acces aux variables CSS de la page qui l'affiche.
  (Un commentaire XML ne peut pas contenir deux tirets consecutifs : les jetons
  du theme sont donc cites ici sans leur prefixe, "color-ink" pour la variable
  du meme nom.)
-->
  <!-- Fond : l'encre prune du theme (jeton color-ink), pas du noir. -->
  <rect width="32" height="32" rx="7" fill="#2E2438"/>

  <!-- Ligne 1 : arete sauge (jeton color-project-1). -->
  <rect x="6"    y="7.5"  width="2.5"  height="5" rx="1.25" fill="#6E8B6B"/>
  <rect x="10.5" y="7.5"  width="15.5" height="5" rx="2"    fill="#F2F0EC"/>

  <!-- Ligne 2 : arete prune (jeton color-project-3). -->
  <rect x="6"    y="14.5" width="2.5"  height="5" rx="1.25" fill="#8A5A7A"/>
  <rect x="10.5" y="14.5" width="15.5" height="5" rx="2"    fill="#F2F0EC"/>

  <!-- Ligne 3 : arete safran (jeton color-project-4). Volontairement plus courte :
       a 16 pixels, une derniere ligne inegale se lit comme une LISTE plutot que
       comme un empilement de barres identiques. -->
  <rect x="6"    y="21.5" width="2.5"  height="5" rx="1.25" fill="#D19A3E"/>
  <rect x="10.5" y="21.5" width="10"   height="5" rx="2"    fill="#F2F0EC"/>
</svg>
