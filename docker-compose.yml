# Orchestrateur : quels conteneurs lancer, comment ils se connectent, ce qui
# persiste. Tous les services rejoignent le meme reseau prive et se joignent par
# leur nom grace au DNS interne de Docker.
# Les images portent un nom pleinement qualifie (docker.io/...) : Podman, lui, ne
# suppose pas Docker Hub par defaut et demanderait interactivement de choisir un
# registre, ce qui casserait le deploiement en une commande.

services:

  # --- Application -----------------------------------------------------------

  database:
    image: docker.io/library/postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [transcendence]
    healthcheck:
      # Le double $$ empeche compose d'interpreter la variable : c'est le shell du
      # conteneur qui la lit a l'execution.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./srcs/backend
    env_file: .env
    environment:
      # Detection par polling : depuis un bind mount, la detection d'evenements est
      # peu fiable sur macOS/Windows.
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./srcs/backend:/app
      # Volume anonyme sur node_modules : sans lui, le bind mount ci-dessus
      # masquerait les modules installes dans l'image par ceux de l'hote.
      - /app/node_modules
      # Hors de /app volontairement : /app contient le code versionne, ici ce sont
      # des donnees utilisateur. Volume nomme, pour qu'elles survivent a "make down"
      # sans jamais etre committees.
      - uploads_data:/var/lib/transcendence/uploads
    networks: [transcendence]
    depends_on:
      # Attend que la base reponde vraiment, pas juste qu'elle soit demarree.
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./srcs/frontend
    volumes:
      - ./srcs/frontend:/app
      - /app/node_modules
    networks: [transcendence]
    restart: unless-stopped

  # Le seul service expose a l'hote : terminaison TLS et reverse proxy.
  nginx:
    build: ./srcs/nginx
    # Ports non privilegies (>= 1024) : obligatoire en Docker rootless, ou un
    # process non-root ne peut pas se lier aux ports < 1024. nginx continue
    # d'ecouter 80 et 443 a l'interieur du conteneur.
    ports:
      - "8080:80"
      - "8443:443"
    networks: [transcendence]
    depends_on: [frontend, backend]
    restart: unless-stopped

  # --- Monitoring ------------------------------------------------------------

  prometheus:
    image: docker.io/prom/prometheus:v3.13.2
    user: "0:0"
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.external-url=https://localhost:8443/prometheus/
      - --web.enable-lifecycle
    volumes:
      # ':ro' : Prometheus ne doit pas ecrire dans des fichiers versionnes.
      - ./srcs/monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    networks: [transcendence]

  node-exporter:
    image: docker.io/prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      # Redirigent node-exporter vers les systemes de fichiers de l'hote, montes
      # ci-dessous en lecture seule. Sans eux, il mesurerait son propre conteneur.
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    networks: [transcendence]

  # Traduit les vues pg_stat_* de PostgreSQL au format Prometheus.
  postgres-exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:v0.20.1
    env_file:
      - .env
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?sslmode=disable
    networks: [transcendence]
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  nginx-exporter:
    image: docker.io/nginx/nginx-prometheus-exporter:1.5.1
    command:
      # URL interne : 'nginx' est resolu par le DNS Docker, 8081 est le serveur
      # virtuel de monitoring declare dans nginx.conf.
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    networks: [transcendence]
    depends_on: [nginx]
    restart: unless-stopped

  # Interface de visualisation. Ne stocke aucune metrique : a chaque
  # rafraichissement, il interroge Prometheus et dessine la reponse.
  grafana:
    image: docker.io/grafana/grafana:13.1.5
    user: "0:0"
    env_file:
      - .env
    environment:
      # URL publique complete : Grafana s'en sert pour ses redirections et les
      # liens absolus renvoyes au navigateur.
      - GF_SERVER_ROOT_URL=https://localhost:8443/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
    volumes:
      # Provisioning : datasources et dashboards decrits par des fichiers versionnes,
      # lus au demarrage. Les JSON de dashboards sont hors de ce dossier pour que le
      # fournisseur ne rencontre que des dashboards dans le chemin qu'il scanne.
      - ./srcs/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./srcs/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks: [transcendence]
    restart: unless-stopped

  # Prometheus decide QUAND alerter ; Alertmanager decide A QUI et COMBIEN DE FOIS.
  alertmanager:
    image: docker.io/prom/alertmanager:v0.33.1
    user: "0:0"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      # Silences et journal des notifications : doivent survivre a un redemarrage,
      # sinon toute alerte serait renotifiee.
      - --storage.path=/alertmanager
      - --web.external-url=https://localhost:8443/alertmanager/
    volumes:
      - ./srcs/monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    networks: [transcendence]
    restart: unless-stopped

# Un unique reseau prive partage : les services communiquent par nom, isoles du
# reste de la machine.
networks:
  transcendence:
    driver: bridge

volumes:
  postgres_data:
  # Fichiers televerses par les utilisateurs : "make down" ne les efface pas, seul
  # "make clean" le fait.
  uploads_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

